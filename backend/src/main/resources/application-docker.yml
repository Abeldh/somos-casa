spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:somoscasa}
    username: ${DB_USERNAME:somoscasa_user}
    password: ${DB_PASSWORD:somoscasa_dev}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}

app:
  jwt:
    secret: ${JWT_SECRET:dev_jwt_secret_256_bits_long_enough_for_hmac_sha256_algorithm}
    expiration: 900000
    refresh-expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin_secret}
    bucket: ${MINIO_BUCKET:somoscasa}
  mail:
    from: noreply@somoscasa.dev
    from-name: SomosCasa Docker
  rate-limit:
    requests: 200
    duration: 60
