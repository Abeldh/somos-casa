apiVersion: apps/v1
kind: Deployment
metadata:
  name: somoscasa-frontend
  namespace: somoscasa
  labels:
    app: somoscasa
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: somoscasa
      component: frontend
  template:
    metadata:
      labels:
        app: somoscasa
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/somoscasa/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: somoscasa-frontend
  namespace: somoscasa
spec:
  selector:
    app: somoscasa
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: somoscasa-ingress
  namespace: somoscasa
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - somoscasa.com
        - www.somoscasa.com
      secretName: somoscasa-tls
  rules:
    - host: somoscasa.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: somoscasa-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: somoscasa-frontend
                port:
                  number: 80
