# CodeQL: análisis estático de seguridad (SAST) del código.
# Escanea JavaScript/JSX (cliente y servidor) en busca de vulnerabilidades
# como inyección, XSS, uso inseguro de datos, etc.
# Documentación: https://docs.github.com/code-security/code-scanning
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Escaneo programado semanal (lunes 06:00 UTC), captura nuevas reglas/CVEs
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analizar código
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality incluye reglas de seguridad y de calidad
          queries: security-and-quality

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
