apiVersion: apps/v1
kind: Deployment
metadata:
  name: somoscasa-backend
  namespace: somoscasa
  labels:
    app: somoscasa
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: somoscasa
      component: backend
  template:
    metadata:
      labels:
        app: somoscasa
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/somoscasa/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: somoscasa-secrets
                  key: db-host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: somoscasa-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: somoscasa-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: somoscasa-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: somoscasa-secrets
                  key: redis-password
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: somoscasa-backend
  namespace: somoscasa
spec:
  selector:
    app: somoscasa
    component: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
