services:
  - type: web
    name: somoscasa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: somoscasa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: somoscasa-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: somoscasa-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: somoscasa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: somoscasa-db
          property: password
      - key: REDIS_HOST
        fromService:
          name: somoscasa-redis
          type: pserv
          property: host
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /actuator/health

  - type: web
    name: somoscasa-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: pserv
    name: somoscasa-redis
    runtime: docker
    dockerCommand: redis-server --requirepass ${REDIS_PASSWORD}
    envVars:
      - key: REDIS_PASSWORD
        generateValue: true

databases:
  - name: somoscasa-db
    plan: starter
    databaseName: somoscasa
    user: somoscasa_user
